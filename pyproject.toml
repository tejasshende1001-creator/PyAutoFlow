[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["pyautoflow"]
omit = ["tests/*", "setup.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
